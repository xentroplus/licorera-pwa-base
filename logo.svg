<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7dc85"/>
      <stop offset="45%" stop-color="#d7a33a"/>
      <stop offset="100%" stop-color="#a96711"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#080808"/>

  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="168" fill="#0b0b0b" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="256" cy="256" r="145" fill="none" stroke="#f4f4f4" stroke-width="8"
            stroke-dasharray="345 55" transform="rotate(-38 256 256)"/>

    <!-- Crown -->
    <path d="M196 122l34-48 27 31 29-31 32 48-20 17H216z" fill="url(#gold)"/>
    <rect x="210" y="132" width="92" height="16" rx="8" fill="url(#gold)"/>

    <!-- Bottle -->
    <rect x="239" y="131" width="34" height="68" rx="10" fill="url(#gold)"/>
    <rect x="226" y="188" width="60" height="170" rx="18" fill="url(#gold)"/>
    <rect x="238" y="232" width="36" height="66" rx="8" fill="#151515" opacity=".9"/>
    <path d="M246 252h20v26h-20z" fill="#d7a33a"/>

    <!-- Monogram -->
    <text x="142" y="286" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="800" fill="#fff">L</text>
    <text x="321" y="286" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="800" fill="#fff">C</text>

    <!-- Decorative baseline -->
    <path d="M116 354h98M298 354h98" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="256" cy="354" r="8" fill="#d7a33a"/>
  </g>
</svg>